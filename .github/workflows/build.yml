# Builds Song Voicer for Mac (Apple Silicon + Intel), Windows and Linux on GitHub's machines.
#  - Actions tab -> "Run workflow": download the builds from the run's Artifacts (GitHub zips each one).
#  - Publishing a Release: the builds are attached to the release as plain files (Mac gets a .dmg,
#    nothing to unzip), so friends can download them straight from the Releases page.
name: Build apps

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write   # lets the build attach files to a release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15        # Apple Silicon Macs (M1 and newer)
            name: mac-apple-silicon
          - os: macos-15-intel  # older Intel Macs
            name: mac-intel
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04    # older glibc, so the build runs on most Linux distros
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: pyinstaller song_voicer.spec --noconfirm
      - name: Make the Mac disk image
        if: runner.os == 'macOS'
        run: |
          # A .dmg opens with a double-click; the Applications shortcut makes installing a drag.
          mkdir dmg
          cp -R "dist/Song Voicer.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Song Voicer" -srcfolder dmg -ov -format UDZO "Song-Voicer-${{ matrix.name }}.dmg"
      - name: Zip the Windows app
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "dist/Song Voicer" -DestinationPath "Song-Voicer-${{ matrix.name }}.zip"
      - name: Pack the Linux app
        if: runner.os == 'Linux'
        run: tar -czf "Song-Voicer-${{ matrix.name }}.tar.gz" -C dist "Song Voicer"
      - uses: actions/upload-artifact@v4
        with:
          name: Song-Voicer-${{ matrix.name }}
          path: Song-Voicer-${{ matrix.name }}.*
      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" Song-Voicer-${{ matrix.name }}.* --clobber
